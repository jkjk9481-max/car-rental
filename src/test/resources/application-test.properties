1# 테스트를 "test" 프로필로 실행할 때(@ActiveProfiles("test"))만 적용되는 설정이다.
# Spring은 src/main/resources/application.properties를 먼저 읽고,
# 아래에 적은 항목만 덮어쓴다. DB 계정 정보와 JWT 키는 main 파일 값을 그대로 쓰므로
# 비밀값을 이 파일에 다시 적지 않는다.

# 개발용 DB(car_rental)와 분리된 테스트 전용 DB.
# 미리 만들어 두어야 한다: CREATE DATABASE car_rental_test;
spring.datasource.url=jdbc:postgresql://localhost:5432/car_rental_test

# 테스트가 시작될 때 테이블을 만들고, 끝나면 지운다.
spring.jpa.hibernate.ddl-auto=create-drop

# 테스트 로그를 읽기 쉽게 SQL 출력을 끈다.
spring.jpa.show-sql=false
